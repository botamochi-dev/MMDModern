; MMDModern 配布用設定。MikuMikuDance.exe と同じフォルダーに置いてください。
; MMDを終了してから編集してください。通常は 1=有効、0=無効です。
; 試験的な高速化機能と時間の計測は、各項目の説明を確認して使用してください。

[View]
; DXVK使用時の3D画面の表示を補助します。auto=自動、1=常に有効、0=無効。
ChildWindow=auto
; MMDの画面更新で3D表示が隠れないようにします。
ClipChildren=1
; 試験的な機能：最小化からの復元時などに、描画の復旧待ちを効率化します。
; 描画に必要なデバイスのリセットや、画像などの再準備は省略しません。
FastRestore=1

[MME]
; エフェクトファイルの変更を確認する間隔（ミリ秒）。1000=1秒。
; エフェクト編集時にすぐ反映したい場合は0にしてください。
FileCheckIntervalMs=1000

[Render]
; モデル・アクセサリーの描画順の確認を効率化します。
DrawOrderTable=1
; テクスチャの確認を効率化します。
TextureLookupHash=1
; MMEが表示しないモデル・アクセサリーの不要な描画処理を減らします。
; 0=無効、1=有効、2=診断のみ（省略せずに記録）。
SkipUndrawnObjects=1
; 描画するモデル・アクセサリーの確認を効率化します。
CurrentObjectCache=1
; MMEが描画する際に不要なMMD標準エフェクトの処理を減らします。
DeferBuiltinEffect=1
; 試験的な機能：画面全体にかけるエフェクトの不要な処理も減らします。
; SkipUndrawnObjects=1が必要です。初期設定では無効です。
SkipPostEffectObjects=0

[Skinning]
; 試験的な機能：モデルの変形計算の待ち時間を減らします。
; CPU負荷が増える場合があります。0=無効、1=有効、2=計測のみ。
FastFork=0
; 上の機能が有効なときの待ち時間設定（マイクロ秒）。通常は変更不要です。
SpinMicroseconds=1000

[Timing]
; 試験的な機能：FPS上限に達しているときのフレーム間隔を調整します。
PreciseFrameWait=0

[Load]
; エフェクトの準備結果を保存し、次回以降の読み込みに利用します。
; MMDModernCacheフォルダーを作成します。初回には準備が必要です。
EffectCache=1
; 画像の読み込み結果をメモリーに保存し、画面復元時などに再利用します。
; 画像ファイルが更新された場合は読み直します。初回には準備が必要です。
TextureCache=1
; 上の機能が使用するメモリーの上限（MB）。
TextureCacheMaxMB=512
; モデル・モーション・シーンなどのファイル読み込みを効率化します。
FileBuffer=1
; 読み込み時間の内訳をログに記録します。計測用です。
Profile=0

[Census]
; 描画の計測。1にするとMMD上のCtrl+Shift+F11で計測できます。
; 結果はMMDModern_census_*.csvとMMDModern.logに保存されます。
Enable=0
; 1回の計測で記録するフレーム数。
Frames=300

[AviOut]
; 試験的な機能：AVI出力時のフレームの受け渡し待ちを減らします。
EventTransfer=1
; AVI出力の画像取得と次のフレームの準備を並行して進めます。
; SkipPreviewPresent=1と組み合わせて使用してください。変更後はMMDを起動し直してください。
AsyncReadback=1
; 試験的な機能：AVI出力中のモデルの頂点更新を遅らせ、変形計算を先に進めます。
; 0=無効、1=有効（AsyncReadback=1が必要）、2=待機時間の計測のみ。
; 対応していない頂点バッファーは元の処理を使います。初期設定では無効です。
VertexUpload=0
; AVI出力中の描画APIの呼び出し時間を記録します。速度改善のための設定ではありません。
GpuCallProfile=0
; AVI出力中のプレビュー表示を省き、GPUの表示待ちを減らします。
; 出力中の画面は更新されなくなります。プレビューが必要な場合は0にしてください。
; AsyncReadback=1と組み合わせて使用してください。
SkipPreviewPresent=1
; AVI出力時の画像ロック・行コピー・ロック解除の時間を個別に記録します。計測用です。
; 有効にするとProfileの計測も行います。初期設定では無効です。
; 2=原因調査用。読み戻しの前にGPU描画完了を待ち、待機時間を分離します。
; 2は出力のタイミングを変更するため、速度比較には使用しないでください。
DetailedProfile=0
; AVI出力の時間の内訳をログに記録します。出力を速くする設定ではありません。
; 100フレームごとと出力停止時に集計します。最後のファイル書き出し時間は含みません。
Profile=1

[Save]
; 試験的な機能：PMM保存時の小さな書き込みをまとめます。
; 書き込み完了を確認してから保存成功とします。EMMやモーションの保存は対象外です。
WriteBuffer=1
; PMM保存の時間の内訳と書き込み回数をログに記録します。計測用です。
Profile=0

[Fix]
; 一部のPMXで、表示枠の不足により起きる読み込み時のクラッシュに対処します。
PmxEmptyDisplayFrames=1
; 一部のPMXで、不正なボーン指定により起きる読み込み時のクラッシュに対処します。
PmxBoneIndex=1
; PMMを読み込んだ後に、MMEのエフェクト割り当てを反映します。
MmeEmmAfterPmmLoad=1

[Edit]
; WAVの開始位置をフレーム数で調整し、別名で保存して読み込みます（30フレーム＝1秒）。
; ＋で遅らせる／−で先頭を詰める。元のWAVは残り、通常再生とAVI出力に反映されます。
; 「MMDModern」→「WAVの開始位置を調整」から操作します。PCMの8／16ビットに対応します。
WavOffset=1
; 画面上で調整したモデルやカメラの位置・回転などの差を、選択したキーフレームへ一括反映します。
ViewportKeyframeAdjust=1
; カメラモードで、カメラのキーフレームの追加・変更・削除を「元に戻す」「やり直し」ボタンと
; Ctrl+Z（元に戻す）／Ctrl+X（やり直し）で戻せるようにします。0=無効（元のMMDの動作）。
; 照明・セルフ影・アクセサリのフレームは対象外です。PMMを読み込むと履歴は消去されます。
CameraUndo=1
; 戻せる回数。MMDのモデルの履歴と同じ30回が初期値です（1〜1000）。
CameraUndoSteps=30

[Model]
; メニューバーの「MMDModern」に、選択中のモデルの名前を変更する項目を追加します。
; 変更した名前はPMMに保存され、PMMを開いたときに表示されます（MMD本来はPMXの名前を表示します）。
; 英語モードでは英語名を変更します。0=無効（元のMMDの動作）。
Rename=1
; 選択中のモデルを同じファイルからもう一度読み込み、キーフレーム（ボーン・表情・表示/IK/外部親）を
; コピーする項目を追加します。名前の末尾に(2)、(3)…が付きます。
; 描画順・MMEのエフェクト割り当てなどモデルの設定は複製されません。0=無効。
Duplicate=1
; 選択した子モデルの外部親（現在値と既存キー全体）を別モデルの同名ボーンへ移行します。
; 「MMDModern」→「別モデルへ外部親を移行」から移行先を選択します。
; 0=無効、1=有効。
ExternalParentTransfer=1
; 外部親候補にカメラを追加し、モデル全体や外部親対応ボーンをカメラの位置・回転・視野角に追従させます。
CameraExternalParent=1

[Debug]
; メッセージやダイアログの内容をログに記録します。不要な場合は0にしてください。
DialogLog=1
; 最小化・復元や、描画が長く止まった時間を記録します。計測用です。
; MMEのサイズ変更時の再準備も記録します。Load.Profile=1で画像読み込みも個別計測します。
StallLog=0
; クラッシュ時に調査用ダンプを保存します。不要な場合は0にしてください。
; 有効にした場合、ダンプには作業中の情報が含まれることがあります。
CrashDump=1
